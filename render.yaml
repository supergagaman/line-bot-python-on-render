services:
  - type: web
    name: linebot
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 60
    envVars:
      - key: LINE_CHANNEL_SECRET
        fromEnv: LINE_CHANNEL_SECRET
      - key: LINE_CHANNEL_ACCESS_TOKEN
        fromEnv: LINE_CHANNEL_ACCESS_TOKEN
      - key: DB_HOST
        fromEnv: DB_HOST
      - key: DB_USER
        fromEnv: DB_USER
      - key: DB_PASS
        fromEnv: DB_PASS
      - key: DB_NAME
        fromEnv: DB_NAME
